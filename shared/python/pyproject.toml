[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claimshield-contracts"
version = "1.0.0"
description = "Amyna shared contracts: domain models, HTTP schemas, uAgents messages"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8,<3"]

[tool.setuptools.packages.find]
include = ["claimshield_contracts*"]

[tool.setuptools.package-data]
claimshield_contracts = ["fixtures/*.json", "py.typed"]
