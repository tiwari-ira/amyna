name: CI

on:
  push:
    branches: [main, branch-1-relay, branch-2-fetch]
  pull_request:

# One run per ref; superseded PR runs are cancelled automatically.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    # The Python gates must pass on both platforms: the team develops on
    # Windows (see requirements.txt) while CI/deploy run on Linux.
    name: python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            fetch/requirements.txt
            core/pyproject.toml
            shared/python/pyproject.toml
            pyproject.toml

      - name: Install pinned environment
        run: python -m pip install -r requirements.txt

      - name: Ruff (lint + format check)
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Mypy ratchet (no NEW errors; baseline scripts/.mypy_baseline.txt)
        run: |
          python -m pip install mypy
          python scripts/mypy_gate.py

      - name: Pytest (shared, core, intelligence, finchnode, fetch)
        run: python -m pytest -q

      - name: Smoke E2E (mock mode, real HTTP - Relay path + ASI:One chat)
        run: python scripts/smoke_e2e.py

      # Deterministic-artifact drift checks: run on Linux only (avoids
      # git autocrlf noise on the Windows runner image).
      - name: OpenAPI drift check
        if: runner.os == 'Linux'
        run: python scripts/export_openapi.py --check

      - name: Docs drift check (README test-count claims)
        if: runner.os == 'Linux'
        run: python scripts/check_docs.py

  docker:
    # Image-build gate: the Dockerfiles must build after any Dockerfile/compose
    # change (non-root users, healthchecks, chowned storage paths).
    name: docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build core, relay and fetch images
        run: |
          docker build -f core/Dockerfile -t amyna-core .
          docker build -f relay/Dockerfile -t amyna-relay .
          docker build -f fetch/Dockerfile -t amyna-fetch .

      - name: Compose files stay valid
        # Both compose files are fail-closed on purpose (${VAR:?required});
        # validation only needs *a* value for every required variable, plus
        # the env-file paths that services reference (prod defaults to
        # ../.env.production relative to deploy/, i.e. the repo root).
        env:
          POSTGRES_USER: ci-validation
          POSTGRES_PASSWORD: ci-validation
          FETCH_SERVICE_TOKEN: ci-validation
          BACKUP_PASSPHRASE: ci-validation
        run: |
          touch .env .env.production
          docker compose config --quiet
          docker compose -f deploy/docker-compose.prod.yml config --quiet

  relay:
    # Relay service gates: types, unit tests, dependency audit.
    name: relay (node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: relay/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type-check (tsc --noEmit)
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Dependency audit (high and above)
        run: npm audit --audit-level=high

      - name: Generated TS types drift check
        working-directory: .
        run: |
          npm --prefix relay run gen:types
          git diff --exit-code -- shared/ts/core.ts shared/openapi/core.openapi.json

  supply-chain:
    # [2.7] Python dependency audit + CycloneDX SBOM artifact.
    name: supply chain (python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pinned environment
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pip-audit

      # Documented, deliberate ignores (see requirements.txt PyNaCl comment):
      #  * pynacl PYSEC-2026-1448 / PYSEC-2026-3002: fixed in 1.6.2, but
      #    cosmpy 0.12.2 (pinned by uagents 0.25.5) requires pynacl==1.6.0.
      #    Revisit on the next uagents upgrade -- until then these stay visible
      #    here instead of being silently invisible.
      #  * ecdsa PYSEC-2026-1325: no fixed release exists (transitive dep of
      #    uagents; used for Agentverse envelope signatures, not patient data).
      - name: pip-audit (fail on anything new; 3 documented ignores)
        run: |
          python -m pip_audit -r requirements.txt --skip-editable \
            --ignore-vuln PYSEC-2026-1448 \
            --ignore-vuln PYSEC-2026-3002 \
            --ignore-vuln PYSEC-2026-1325

      - name: CycloneDX SBOM
        run: |
          python -m pip_audit -r requirements.txt --skip-editable -f cyclonedx-json -o sbom.json \
            --ignore-vuln PYSEC-2026-1448 \
            --ignore-vuln PYSEC-2026-3002 \
            --ignore-vuln PYSEC-2026-1325

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
          retention-days: 30
