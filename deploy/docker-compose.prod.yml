# Amyna production stack (persistent, auto-restarting services).
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file ../.env.production up -d
#
# Every service: restart-on-failure, health-checked where applicable, and fronted
# by your HTTPS ingress (the PUBLIC_BASE_URL xAI/Telnyx/Relay call). Postgres
# uses a volume + daily backups (backup.sh); encryption-at-rest and alerting
# come from your provider.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amyna}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-amyna}"]
      interval: 15s
      timeout: 5s
      retries: 20

  core:
    build:
      context: ..
      dockerfile: core/Dockerfile
    restart: unless-stopped
    env_file: ${CORE_ENV_FILE:-../.env.production}
    environment:
      # APP_ENV=prod makes Core fail closed on any missing live setting.
      APP_ENV: prod
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-amyna}
      CORE_BASE_URL: http://core:8080
      RELAY_SERVICE_URL: http://relay:3000
      ORCHESTRATOR_URL: http://agents:8000
      FETCH_MODE: agentverse
      NOTIFY_MODE: relay_service
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=5)\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  relay:
    build:
      context: ..
      dockerfile: relay/Dockerfile
    restart: unless-stopped
    env_file: ${CORE_ENV_FILE:-../.env.production}
    environment:
      CORE_BASE_URL: http://core:8080
    depends_on:
      - core

  agents:
    build:
      context: ..
      dockerfile: fetch/Dockerfile
    restart: unless-stopped
    environment:
      FETCH_MODE: agentverse
      CORE_BASE_URL: http://core:8080
      FETCH_SERVICE_TOKEN: ${FETCH_SERVICE_TOKEN:?}
    depends_on:
      - core
    command: ["python", "-m", "fetch.agents.run_all"]

  jobs:
    build:
      context: ..
      dockerfile: fetch/Dockerfile
    restart: unless-stopped
    environment:
      CORE_BASE_URL: http://core:8080
      WORKER_INTERVAL_S: ${WORKER_INTERVAL_S:-5}
      FETCH_SERVICE_TOKEN: ${FETCH_SERVICE_TOKEN:?}
    depends_on:
      - core
    command: ["python", "scripts/job_worker.py"]

  backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:-amyna}
    volumes:
      - ./backup.sh:/deploy/backup.sh:ro
      - backups_prod:/backups
    entrypoint: ["sh", "/deploy/backup.sh"]

volumes:
  pgdata_prod:
  backups_prod:
